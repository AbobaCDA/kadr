name: Windows installer

# Builds a ready-to-run Kadr installer in the cloud, so no one needs Rust,
# Visual Studio or Node on their own machine.
#
# Where to get the exe:
#   * Actions → "Windows installer" → Run workflow → the run's Artifacts
#     section has a zip containing the installer and the portable exe.
#   * Push a tag (`git tag v1.0.17 && git push --tags`) and the same build is
#     attached to a GitHub Release, so the download link is stable.
#
# Deliberately not inherited from upstream: their release workflow signs
# updater artifacts and needs TAURI_SIGNING_PRIVATE_KEY in repository secrets.
# A personal fork has no such key, and a release job that fails on a missing
# secret is worse than no release job. Signing is opt-in below.

on:
  push:
    branches: [master, main]
  # No `pull_request` trigger on purpose. Dependabot opens ~10 PRs at once on
  # a fresh fork, and each one used to start a 25-minute Windows build; ten of
  # those in parallel is how a free Actions quota disappears and how the run
  # list fills with red Xs. Re-add it if you start reviewing PRs.
  workflow_dispatch:
    inputs:
      slim:
        description: "Slim build (no PP-OCR/ONNX): ~7 MB installer instead of ~9 MB"
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the debug symbols out of the cached build: the cache is size-limited
  # and the release binary is stripped anyway.
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build (${{ inputs.slim && 'slim' || 'full' }})
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust
        # The runner's default host triple is already *-pc-windows-msvc, so no
        # toolchain input here: passing one to @stable is how these jobs end up
        # installing a GNU toolchain and then failing to link.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # The slim and full builds produce different binaries; keep their
          # caches apart so one does not evict the other's dependencies.
          key: ${{ inputs.slim && 'slim' || 'full' }}

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and unit tests
        # Cheap insurance before a 20-minute Rust build: a TS error or a broken
        # hotkey matcher should fail in two minutes, not in twenty.
        run: |
          npx tsc --noEmit
          npx vitest run

      # Compiling and bundling are separate steps on purpose. The bundler
      # downloads NSIS and packs an installer on top of an already-built exe,
      # and that is the part most likely to fail for reasons that have nothing
      # to do with the code. Splitting them means a red X points at the real
      # culprit, and a bundler failure still leaves a runnable exe behind.
      - name: Build the installer
        id: installer
        continue-on-error: true
        shell: pwsh
        run: |
          # The NSIS bundler downloads nsis-3.13.zip and nsis_tauri_utils.dll
          # from GitHub's release CDN while packing the installer, and that CDN
          # answers 504 often enough to be worth retrying: "failed to bundle
          # project: `http status: 504`" after a 25-minute successful compile is
          # the most annoying failure this workflow has. Retrying costs seconds
          # because the Rust build is already cached and incremental.
          $script = if ("${{ inputs.slim }}" -eq "true") { "dist:slim" } else { "dist" }
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "::group::npm run $script (attempt $i of $attempts)"
            npm run $script
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -eq 0) { Write-Host "bundled on attempt $i"; exit 0 }
            if ($i -lt $attempts) {
              Write-Host "::warning::attempt $i failed (exit $code); retrying in 30s"
              Start-Sleep -Seconds 30
            }
          }
          Write-Host "::error::bundling failed $attempts times; the compile itself may still be fine, see the next step"
          exit 1

      - name: Build the portable exe
        # Only when bundling did not already produce one. `tauri build
        # --no-bundle` stops after compiling and linking: no NSIS download, no
        # installer packing, nothing that can fail outside the Rust build.
        if: steps.installer.outcome != 'success'
        shell: pwsh
        run: |
          $env:RUST_BACKTRACE = "1"
          if ("${{ inputs.slim }}" -eq "true") {
            npm run dist:slim:dir
          } else {
            npm run dist:dir
          }

      - name: Collect build outputs
        if: always()
        shell: pwsh
        run: |
          $nsis = "src-tauri/target/release/bundle/nsis"
          $out = "dist-out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (Test-Path $nsis) {
            Copy-Item "$nsis/*.exe" $out -Force
          }
          # The exe is named after the Cargo package (`kensaku`), not after
          # productName in tauri.conf.json -- which is why this looks for both.
          # Missing it silently used to leave the artifact without a portable
          # build at all.
          $portable = @("kadr.exe", "kensaku.exe", "Kadr.exe") |
            ForEach-Object { "src-tauri/target/release/$_" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if ($portable) {
            Copy-Item $portable "$out/kadr-portable.exe" -Force
            Write-Host "portable exe: $portable"
          } else {
            Write-Host "::warning::no portable exe found in src-tauri/target/release"
          }
          Get-ChildItem $out | ForEach-Object {
            "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - name: Upload artifacts
        # Also on failure: the portable exe is worth having even when the
        # installer step went red, and a finished upload is easier to find than
        # a log line.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kadr-windows-${{ github.sha }}-${{ inputs.slim && 'slim' || 'full' }}
          path: dist-out/*
          if-no-files-found: warn
          retention-days: 30

      - name: Warn about a missing installer
        if: steps.installer.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "::warning::The NSIS installer was not built (see the 'Build the installer' step above). The artifact still contains kadr-portable.exe, which runs without installing anything."

      - name: Attach to the release
        # Only for tags / published releases, so every push does not create a
        # release. The tag is the version marker.
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-out/*
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
